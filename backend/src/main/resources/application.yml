spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: scrapworld-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scrapworld?serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    remember-token-ttl: ${JWT_REMEMBER_TOKEN_TTL:30d}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
